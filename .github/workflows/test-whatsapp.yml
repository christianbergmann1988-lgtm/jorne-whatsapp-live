name: WhatsApp Test

on:
  workflow_dispatch:

jobs:
  whatsapp-test:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pakete installieren
        run: npm install

      - name: Bot starten
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          npm start &
          BOT_PID=$!

          echo "Warte auf QR-Code..."
          for i in {1..60}; do
            if [ -f whatsapp-qr.png ]; then
              echo "QR-Code gefunden."
              break
            fi
            sleep 2
          done

          sleep 10

          if [ -f whatsapp-qr.png ]; then
            echo "QR-Code ist bereit."
          else
            echo "Kein QR-Code erzeugt."
          fi

      - name: WhatsApp QR-Code hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-qr-code
          path: whatsapp-qr.png
          if-no-files-found: ignore
